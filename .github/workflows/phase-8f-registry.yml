name: Phase 8F registry migration

on:
  push:
    branches:
      - phase-8f-server-edge-signals
    paths:
      - .github/workflows/phase-8f-registry.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-8f-server-edge-signals
      - name: Update browser tool registry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text()
          old = '{ id: "server-info", name: "Server Information", description: "Gather basic server and technology signals.", route: "/tools/server", status: "coming_soon" }'
          new = '{ id: "server-info", name: "Server Information", description: "Inspect observable server, delivery, caching, and edge/proxy response signals.", route: "/tools/server", status: "available" }'
          if old not in s:
              raise SystemExit('expected server-info registry entry not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit migration
        run: |
          git config user.name "sautilink-automation"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Expose Server Information in web catalog"
          git push origin HEAD:phase-8f-server-edge-signals
