name: Phase 8I communications wiring

on:
  push:
    branches:
      - phase-8i-sautilink-account
    paths:
      - .github/workflows/phase-8i-communications-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-8i-sautilink-account
      - name: Wire verified account notice
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('functions/api/account/[[path]].js')
          s = p.read_text()

          marker = 'import { getRequestId } from "../../../src/utils/request.js";\n'
          addition = '''import {\n  COMMUNICATION_CLASSES,\n  communicationStatus,\n  sendTransactionalEmail,\n} from "../../../src/communications/index.js";\nimport { accountVerifiedEmail } from "../../../src/communications/templates.js";\n'''
          if addition not in s:
              if marker not in s:
                  raise SystemExit('import marker not found')
              s = s.replace(marker, marker + addition, 1)

          helper_marker = '\nexport async function onRequest(context) {'
          helper = '''\nfunction scheduleVerifiedAccountNotice(context, user, profileResult, env) {\n  if (!user?.email || profileResult?.ok !== true || profileResult?.existing === true) return;\n  const profile = Array.isArray(profileResult?.body) ? profileResult.body[0] || null : null;\n  const message = accountVerifiedEmail({\n    fullName: profile?.full_name || user?.user_metadata?.full_name,\n    username: profile?.username || user?.user_metadata?.username,\n  });\n  context.waitUntil(\n    sendTransactionalEmail({\n      messageClass: COMMUNICATION_CLASSES.TRANSACTIONAL,\n      to: user.email,\n      toName: profile?.full_name || user?.user_metadata?.full_name || "",\n      ...message,\n    }, env).catch(() => null)\n  );\n}\n'''
          if helper not in s:
              if helper_marker not in s:
                  raise SystemExit('handler marker not found')
              s = s.replace(helper_marker, helper + helper_marker, 1)

          old_status = '''    const status = accountServiceStatus(env);\n    return ok({ available: status.publicReady && status.adminReady }, requestId);'''
          new_status = '''    const status = accountServiceStatus(env);\n    const communications = communicationStatus(env);\n    return ok({\n      available: status.publicReady && status.adminReady,\n      communications: {\n        authEmailTransport: communications.authEmailTransport,\n        transactionalEmailReady: communications.transactionalEmailReady,\n        whatsappReady: communications.whatsappReady,\n        marketingProviderConfigured: communications.marketingProviderConfigured,\n      },\n    }, requestId);'''
          if old_status in s:
              s = s.replace(old_status, new_status, 1)
          elif new_status not in s:
              raise SystemExit('status marker not found')

          verify_marker = '''    const profileReady = result.profile?.ok === true;\n    const profileIssue = result.profile?.reason || null;'''
          verify_new = '''    const profileReady = result.profile?.ok === true;\n    const profileIssue = result.profile?.reason || null;\n    scheduleVerifiedAccountNotice(context, result.body?.user, result.profile, env);'''
          if verify_marker in s:
              s = s.replace(verify_marker, verify_new, 1)
          elif verify_new not in s:
              raise SystemExit('verify marker not found')

          setup_marker = '''    if (!result.ok) {\n      return fail(result.reason === "username_taken" ? "USERNAME_TAKEN" : "PROFILE_SETUP_FAILED", result.message || "Unable to finish your profile.", result.status || 400, requestId, session.cookies);\n    }\n    return ok({ profileReady: true }, requestId, 201, session.cookies);'''
          setup_new = '''    if (!result.ok) {\n      return fail(result.reason === "username_taken" ? "USERNAME_TAKEN" : "PROFILE_SETUP_FAILED", result.message || "Unable to finish your profile.", result.status || 400, requestId, session.cookies);\n    }\n    scheduleVerifiedAccountNotice(context, session.user, result, env);\n    return ok({ profileReady: true }, requestId, 201, session.cookies);'''
          if setup_marker in s:
              s = s.replace(setup_marker, setup_new, 1)
          elif setup_new not in s:
              raise SystemExit('setup marker not found')

          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "sautilink-automation"
          git config user.email "actions@users.noreply.github.com"
          git add 'functions/api/account/[[path]].js'
          git diff --cached --quiet && exit 0
          git commit -m "Connect account verification to communications layer"
          git push origin HEAD:phase-8i-sautilink-account
