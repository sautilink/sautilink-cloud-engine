name: Phase 8I roadmap communications alignment

on:
  push:
    branches:
      - phase-8i-sautilink-account
    paths:
      - .github/workflows/phase-8i-roadmap-comms.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-8i-sautilink-account
      - name: Update roadmap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ROADMAP.md')
          s = p.read_text()
          old = '''  - optional ecosystem email updates remain separate consent and default off\n  - anonymous Cloud Engine scans continue to work without an account'''
          new = '''  - optional ecosystem email updates remain separate consent and default off\n  - reviewed Supabase Auth and security-notification templates are stored under `supabase/templates/` as the source of truth\n  - authentication/security email is owned by Supabase Auth and delivered through custom SMTP; application transactional email has a separate ZeptoMail API adapter\n  - post-verification account notice is scheduled with Pages `context.waitUntil()` and never blocks successful account verification\n  - product updates cannot use the transactional ZeptoMail API and still require explicit email opt-in plus a dedicated marketing-capable provider\n  - WhatsApp communication remains disabled until the current E.164 number has server-owned verification proof and explicit opt-in\n  - anonymous Cloud Engine scans continue to work without an account'''
          if old not in s:
              raise SystemExit('Phase 8I roadmap marker not found')
          s = s.replace(old, new, 1)
          old2 = '''- Phase 8K: Communications Foundation\n  - production transactional email configuration and account/security templates\n  - explicit communication preferences; promotional messaging remains separate from authentication mail\n- WhatsApp preferences and verified-number flow after the email/account foundation'''
          new2 = '''- Phase 8K: Communications Activation & Delivery Operations\n  - activate and live-verify ZeptoMail custom SMTP for hosted Supabase Auth using `noreply@sautilink.com`\n  - synchronize reviewed templates into hosted Supabase Auth and enable selected security notifications\n  - configure the server-only ZeptoMail API token and live-verify the post-verification transactional notice\n  - choose a dedicated marketing-capable provider before any ecosystem campaign delivery is enabled\n- WhatsApp provider and verified-number delivery flow after the email/account foundation'''
          if old2 not in s:
              raise SystemExit('Phase 8K roadmap marker not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit roadmap
        run: |
          git config user.name "sautilink-automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "Align roadmap with communications foundation"
          git push origin HEAD:phase-8i-sautilink-account
