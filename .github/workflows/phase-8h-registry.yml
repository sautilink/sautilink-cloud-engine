name: Phase 8H registry migration

on:
  push:
    branches:
      - phase-8h-cache-compression
    paths:
      - .github/workflows/phase-8h-registry.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-8h-cache-compression
      - name: Add cache tool to registries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('public/app.js'), Path('src/config/tools.js')]:
              lines = p.read_text().splitlines()
              marker = '      { id: "lighthouse",'
              idx = next((i for i, line in enumerate(lines) if line.startswith(marker)), None)
              if idx is None:
                  raise SystemExit(f'lighthouse marker not found in {p}')
              entry = '      { id: "cache-compression", name: "Cache & Compression Inspector", description: "Inspect observed caching, validators, variation, range, and content-encoding response signals.", route: "/tools/cache", status: "available" },'
              if entry not in lines:
                  lines.insert(idx, entry)
              p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit migration
        run: |
          git config user.name "sautilink-automation"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js src/config/tools.js
          git diff --cached --quiet && exit 0
          git commit -m "Expose Cache and Compression Inspector"
          git push origin HEAD:phase-8h-cache-compression
