name: Hotfix Manrope Cache

on:
  push:
    branches:
      - hotfix-manrope-cache
    paths:
      - .github/workflows/hotfix-manrope-cache.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-manrope-cache
      - run: python3 .github/scripts/hotfix_manrope_cache.py
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public tests
          git commit -m "Force fresh Manrope typography assets"
          git push origin hotfix-manrope-cache
